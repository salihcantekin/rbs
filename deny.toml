# cargo-deny configuration. CI runs `cargo deny check bans licenses`.
# ADR-0016: the desktop app is native; no web view or web UI runtime anywhere in the workspace.

[bans]
multiple-versions = "allow"
deny = [
    { name = "wry", reason = "ADR-0016: no web view UI" },
    { name = "tauri", reason = "ADR-0016: no web view UI" },
    { name = "webview2-com", reason = "ADR-0016: no web view UI" },
    { name = "webkit2gtk", reason = "ADR-0016: no web view UI" },
    # CEF renders the browser source as video in a separate process (ADR-0006); only that adapter may use it.
    { name = "cef", wrappers = ["rbs-source-browser"], reason = "ADR-0016: CEF only for the browser source" },
    # TLS uses rustls on the ring provider: no CMake, NASM or system OpenSSL in the build.
    { name = "aws-lc-sys", reason = "ADR-0046: rustls on the ring provider" },
    { name = "aws-lc-fips-sys", reason = "ADR-0046: rustls on the ring provider" },
    { name = "openssl-sys", reason = "ADR-0046: rustls on the ring provider" },
]

# ADR-0010: RBS is GPL-3.0-or-later; every dependency must be GPL-3.0 compatible.
# Allowing GPL-3.0-only (for example Slint's GPL option) makes release binaries effectively GPL-3.0-only.
[licenses]
unused-allowed-license = "allow"
allow = [
    "GPL-3.0-or-later",
    "GPL-3.0-only",
    "GPL-2.0-or-later",
    "LGPL-2.1-only",
    "LGPL-3.0-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "MPL-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = false
