[package]
name = "qt-proto"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
dock-model = { path = "../model" }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
wgpu = "27"
pollster = "0.4"
serde_json = "1"

[build-dependencies]
cxx-qt-build = "0.10"

[features]
default = ["wgpu27"]
wgpu27 = []
