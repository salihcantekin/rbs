[workspace]
resolver = "2"
members = ["crates/*", "xtask"]
# rbs-browser-cef has its own lock file so no workspace command builds CEF
# (ADR-0132 decision 1).
exclude = ["prototypes", "crates/rbs-browser-cef"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.87"
repository = "https://github.com/salihcantekin/rbs"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "deny"

# Smaller debug builds: line tables keep backtraces readable, and third-party
# crates carry no debug info. A single target/ reached 55 GB with full DWARF
# (Skia, Slint, wgpu), and each git worktree kept its own copy.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# The audio graph's tests resample minutes of simulated audio; unoptimised they take
# seconds (ADR-0032 wants milliseconds). Optimising this one crate in test builds keeps
# them fast without changing any other crate's debug build.
[profile.dev.package.rbs-audio]
opt-level = 2

# Slint generates about 53 MB of Rust for the app's UI; nobody steps through it. Without
# line tables the crate builds in 269 s instead of 308 s on a 4-core machine and its
# library is 750 MB instead of 900 MB.
[profile.dev.package.rbs-app-ui]
debug = false

# The Slint compiler runs in rbs-app-ui's build script (code generation) and, with the
# UI live preview, inside the app on every `.slint` save. Optimised, code generation
# takes 11 s instead of 19 s and a live reload 1.5 s instead of about 20 s (4 cores).
[profile.dev.package.i-slint-compiler]
opt-level = 2
