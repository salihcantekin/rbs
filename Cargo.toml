[workspace]
resolver = "2"
members = ["crates/*", "xtask"]
exclude = ["prototypes"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.87"
repository = "https://github.com/salihcantekin/rbs"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "deny"

# Smaller debug builds: line tables keep backtraces readable, and third-party
# crates carry no debug info. A single target/ reached 55 GB with full DWARF
# (Skia, Slint, wgpu), and each git worktree kept its own copy.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# The audio graph's tests resample minutes of simulated audio; unoptimised they take
# seconds (ADR-0032 wants milliseconds). Optimising this one crate in test builds keeps
# them fast without changing any other crate's debug build.
[profile.dev.package.rbs-audio]
opt-level = 2
