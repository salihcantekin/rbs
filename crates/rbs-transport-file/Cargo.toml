[package]
name = "rbs-transport-file"
description = "File transport adapter for RBS: writes muxer chunks to a local file on its own thread, applying patches."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rbs-core = { path = "../rbs-core" }
rbs-transport = { path = "../rbs-transport" }
# Wait-free single-producer single-consumer ring for the hand-off to the I/O thread
# (output-ports spec, "Threading"; P6). MIT or Apache-2.0, no dependencies.
rtrb = "0.4"

[dev-dependencies]
rbs-transport = { path = "../rbs-transport", features = ["conformance"] }

[lints]
workspace = true
