[package]
name = "rbs-user-data"
description = "RBS user data: versioned documents in the config directory, libraries of named entries (output profiles, scene collections) with import and export, and which ones are in use (ADR-0051)."
version.workspace = true
edition.workspace = true
# `File::try_lock` (1.89) for the writer lock; application layer only, like
# rbs-remote-settings.
rust-version = "1.89"
repository.workspace = true
license.workspace = true
publish.workspace = true

# Application layer: shared by rbs-app and rbs-cli. No toolkit, engine or adapter crate,
# so rbs-cli does not pull Slint (ADR-0008). serde and toml are the versions the app
# crates already use.
[dependencies]
rbs-core = { path = "../rbs-core" }
rbs-graph = { path = "../rbs-graph" }
rbs-scene = { path = "../rbs-scene" }
rbs-ui = { path = "../rbs-ui" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[lints]
workspace = true
