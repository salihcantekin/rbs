[package]
name = "rbs-thread-os"
description = "OS adapter for the RBS thread policy port: MMCSS and timer resolution on Windows, time-constraint policy on macOS, SCHED_FIFO or rtkit and timer slack on Linux."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rbs-core = { path = "../rbs-core" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# rtkit over the system D-Bus (pure Rust, MIT); already in the workspace through the
# desktop shell's accessibility stack.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", optional = true, default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_System_Threading",
] }

[features]
default = []
# Linux: ask rtkit (org.freedesktop.RealtimeKit1) for SCHED_RR when the process may
# not set a real-time class itself. Off by default: rtkit only grants a process with
# RLIMIT_RTTIME set, and a real-time thread that then runs that long without blocking
# gets the process killed (ADR-0030). Enable only with a SIGXCPU strategy in place.
rtkit = ["dep:zbus"]

[lints]
workspace = true

[[bench]]
name = "wakeup"
harness = false
