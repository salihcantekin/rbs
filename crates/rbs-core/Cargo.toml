[package]
name = "rbs-core"
description = "Foundation types for RBS: master clock and timing, media frame types, capability model, adapter registry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Shared, sliceable packet payloads (docs/architecture/overview.md#memory-model, ADR-0018).
bytes = "1.9"

[features]
# Test support shared by port conformance suites (`rbs_core::conformance`). Enabled by
# port crates' `conformance` features; never needed at runtime.
conformance = []

[lints]
workspace = true

[dev-dependencies]
# Micro-benchmarks for hot-path code (measure-performance skill, ADR-0009).
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# Allocation guard for real-time functions (performance budgets: no allocation on hot paths).
allocation-counter = "0.8"

[[bench]]
name = "timing"
harness = false
