[package]
name = "rbs-mux-flac"
description = "Native FLAC muxer for RBS: one stream, header written once, no size patch."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rbs-core = { path = "../rbs-core" }
rbs-mux = { path = "../rbs-mux" }

[dev-dependencies]
rbs-mux = { path = "../rbs-mux", features = ["conformance"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "mux"
harness = false

[lints]
workspace = true
