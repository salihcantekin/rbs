[package]
name = "rbs-codec-flac"
description = "FLAC audio encoder for RBS: a native stream of fixed-predictor frames."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rbs-core = { path = "../rbs-core" }
rbs-codec = { path = "../rbs-codec" }

[dev-dependencies]
rbs-codec = { path = "../rbs-codec", features = ["conformance"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "encode"
harness = false

[lints]
workspace = true
