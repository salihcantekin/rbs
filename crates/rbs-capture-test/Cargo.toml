[package]
name = "rbs-capture-test"
description = "Synthetic capture adapter for RBS: deterministic test-pattern displays, windows and cameras for CI and conformance."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rbs-capture = { path = "../rbs-capture" }
rbs-core = { path = "../rbs-core" }

[lints]
workspace = true

[dev-dependencies]
# Allocation guard for the real-time `latest_frame` check (same crate as rbs-core).
allocation-counter = "0.8"
# Micro-benchmark of the real-time `latest_frame` path (measure-performance skill).
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "latest_frame"
harness = false
