[package]
name = "rbs-cli"
description = "The headless RBS command line: records a scene to a file or streams it with the platform's adapters (ADR-0040)."
version.workspace = true
edition.workspace = true
# rbs-remote-settings needs 1.89 (`File::lock`).
rust-version = "1.89"
repository.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rbs-cli"
path = "src/main.rs"

# Application layer: the composition root. It may depend on everything; its built-in
# adapters come from rbs-platform (ADR-0160, P1).
[dependencies]
rbs-core = { path = "../rbs-core" }
rbs-engine = { path = "../rbs-engine" }
rbs-graph = { path = "../rbs-graph" }
rbs-gpu = { path = "../rbs-gpu" }
rbs-scene = { path = "../rbs-scene" }
rbs-sources = { path = "../rbs-sources" }
# Permission requests before a recording opens devices (src/permissions.rs).
rbs-capture = { path = "../rbs-capture" }
rbs-audio-io = { path = "../rbs-audio-io" }
rbs-record = { path = "../rbs-record" }
# The built-in adapters, the same list the app registers (ADR-0160).
rbs-platform = { path = "../rbs-platform" }
rbs-vcam = { path = "../rbs-vcam" }
rbs-codec = { path = "../rbs-codec" }
rbs-thread-os = { path = "../rbs-thread-os" }
rbs-transport-file = { path = "../rbs-transport-file" }
# `stream`: the stream's URL, secret and reconnect policy.
rbs-transport = { path = "../rbs-transport" }
# `token`: the remote control settings file, shared with rbs-app.
rbs-remote-settings = { path = "../rbs-remote-settings" }
# `token` changes go to a running RBS over local IPC (`tokens.*` requests).
rbs-api = { path = "../rbs-api" }
rbs-api-ipc = { path = "../rbs-api-ipc" }
# `project`: editor projects from a recording manifest (ADR-0089).
rbs-project = { path = "../rbs-project" }
# `remote fingerprint`: reads the stored certificate and key (ADR-0046).
rbs-api-ws = { path = "../rbs-api-ws" }
# `obs-import`: OBS scene collections into a new RBS collection (ADR-0131), with the
# filter catalogues that check the importer's type ids and the user data it writes to.
rbs-import-obs = { path = "../rbs-import-obs" }
rbs-filters = { path = "../rbs-filters" }
rbs-audio-filters = { path = "../rbs-audio-filters" }
rbs-params = { path = "../rbs-params" }
rbs-user-data = { path = "../rbs-user-data" }
rbs-ui = { path = "../rbs-ui" }
# Lines to stdout and stderr that never panic when the pipe closes (`outln!`, `errln!`).
rbs-crash = { path = "../rbs-crash" }
# The diagnostics log, to standard error (ADR-0158).
rbs-log = { path = "../rbs-log" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.180"

[dev-dependencies]
rbs-vcam-test = { path = "../rbs-vcam-test" }
# Reference adapters for the scene-building tests (deterministic, no devices).
rbs-capture-test = { path = "../rbs-capture-test" }
rbs-audio-io-test = { path = "../rbs-audio-io-test" }

[lints]
workspace = true
