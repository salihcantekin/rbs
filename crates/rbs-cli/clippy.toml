# Tests may unwrap, expect and panic (the root clippy.toml; clippy reads only this file
# for this crate, so the lines are repeated here).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

# Standard output and error (crash-resilience spec, "Standard output and error"): the std
# macros panic when the pipe or terminal behind them closed; these drop the line.
disallowed-macros = [
    { path = "std::println", reason = "panics when stdout is closed; use rbs_crash::outln!" },
    { path = "std::eprintln", reason = "panics when stderr is closed; use rbs_crash::errln!" },
    { path = "std::print", reason = "panics when stdout is closed; use rbs_crash::outln!" },
    { path = "std::eprint", reason = "panics when stderr is closed; use rbs_crash::errln!" },
    { path = "std::dbg", reason = "panics when stderr is closed; use rbs_crash::errln!" },
]
