[package]
name = "rbs-audio-io-test"
description = "Synthetic audio input adapter for RBS: deterministic sine-wave microphones and loopback for CI and conformance."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rbs-audio-io = { path = "../rbs-audio-io" }
rbs-core = { path = "../rbs-core" }

[features]
# Implements the port's conformance `TestHooks` for the backend. Test support only,
# so runtime builds that use the synthetic adapter (demos) do not compile the suite.
conformance = ["rbs-audio-io/conformance"]

[dev-dependencies]
# This crate's own tests run the suite.
rbs-audio-io-test = { path = ".", features = ["conformance"] }
# Allocation guard for the real-time `read` check (same crate as rbs-core).
allocation-counter = "0.8"

[lints]
workspace = true
