[package]
name = "rbs-capture-pipewire"
description = "PipeWire adapter for the RBS capture port: Linux video nodes as zero-copy DMA-BUFs or system memory."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rbs-capture = { path = "../rbs-capture" }
rbs-core = { path = "../rbs-core" }

# PipeWire through pipewire-rs (MIT). Links libpipewire-0.3, present on every desktop
# Linux distribution that ships PipeWire; building needs its development headers.
[target.'cfg(target_os = "linux")'.dependencies]
bytes = "1.9"
libc = "0.2"
pipewire = { version = "0.10", features = ["v0_3_33"] }

[dev-dependencies]
allocation-counter = "0.8"

[target.'cfg(target_os = "linux")'.dev-dependencies]
pipewire = { version = "0.10", features = ["v0_3_34"] }

[lints]
workspace = true
