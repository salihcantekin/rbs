[package]
name = "rbs-codec-mf"
description = "Media Foundation adapter for the RBS encoder port: AAC-LC on Windows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[features]
# A fake encoder engine behind the same session, so the port suite and the
# adapter's behaviour tests run on every platform (as in rbs-codec-hw).
testing = []

[dependencies]
rbs-codec = { path = "../rbs-codec" }
rbs-core = { path = "../rbs-core" }
# AudioSpecificConfig for the stream extradata (ADR-0019, decision 7).
rbs-media-format = { path = "../rbs-media-format" }

[target.'cfg(windows)'.dependencies]
# Microsoft's official bindings (MIT OR Apache-2.0), same version as rbs-capture-mf.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }
windows-core = "0.62"

[dev-dependencies]
rbs-codec = { path = "../rbs-codec", features = ["conformance"] }
rbs-codec-mf = { path = ".", features = ["testing"] }
# Micro-benchmarks for the encode path (measure-performance skill, ADR-0009).
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "encode"
harness = false

[lints]
workspace = true
