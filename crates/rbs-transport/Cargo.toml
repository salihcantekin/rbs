[package]
name = "rbs-transport"
description = "Transport port for RBS: output delivery traits (files, RTMP, SRT, ...), capabilities and conformance suite."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rbs-core = { path = "../rbs-core" }

[features]
# The conformance suite (`rbs_transport::conformance`). Adapter crates enable it in their
# dev-dependencies; it is test support and is never needed at runtime.
conformance = ["rbs-core/conformance"]

[dev-dependencies]
# Lets this crate's own tests use the suite without enabling it for normal builds.
rbs-transport = { path = ".", features = ["conformance"] }

[lints]
workspace = true
