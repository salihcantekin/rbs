# The browser engine add-on: the CEF runtime the `rbs-browser-cef` runner loads
# (ADR-0132 decision 2, ADR-0145 decision 3, spec docs/specs/add-ons.md).
#
# `version` is the CEF version of the `cef` crate in this directory's Cargo.lock
# (`156.6.0+156.0.30` -> `156.0.30`); `cargo test -p xtask` fails when they differ.
# A version move changes this file and the crate together and runs a short device
# check on Windows and macOS.
#
# Archives are the upstream "minimal" CEF builds until the RBS mirror exists
# (ADR-0132 decision 3). Provenance (2026-11-18): each archive was downloaded from
# the URL below; its SHA-1 matched the upstream build index
# (https://cef-builds.spotifycdn.com/index.json); `sha256` was computed from that
# same copy. `unpacked_size` is the sum of the archive's file sizes.

id = "org.rbs.browser-engine"
kind = "runtime"
name = "Browser engine"
summary = "Lets browser sources show web pages (Chromium Embedded Framework)."
version = "156.0.30"
hosts = ["cef-builds.spotifycdn.com"]
notices = "https://cef-builds.spotifycdn.com/index.html"

# upstream sha1 0b4c2189e3b93033bbef13add1a86f66849c1e62
[platform.x86_64-unknown-linux-gnu]
url = "https://cef-builds.spotifycdn.com/cef_binary_156.0.30%2Bg6028375%2Bchromium-156.0.8078.96_linux64_minimal.tar.bz2"
size = 333332290
sha256 = "356db99d653698aa9ba78b22965032b4fa5b23ba079ffdbaa5d28a8530f04011"
unpacked_size = 1597510500
format = "tar.bz2"
strip = 1
library_dir = "Release"
resources_dir = "Resources"
required = ["libcef.so", "icudtl.dat", "v8_context_snapshot.bin"]

