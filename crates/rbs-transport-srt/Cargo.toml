[package]
name = "rbs-transport-srt"
description = "SRT transport adapter for RBS: sends MPEG-TS chunks to an SRT listener (caller mode, live mode) from its own I/O thread."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rbs-core = { path = "../rbs-core" }
rbs-transport = { path = "../rbs-transport" }
# Wait-free single-producer single-consumer ring for the hand-off to the I/O thread
# (output-ports spec, "Threading"; P6). MIT or Apache-2.0, no dependencies. Already
# used by rbs-transport-file and rbs-transport-rtmp.
rtrb = "0.4"


[dev-dependencies]
rbs-transport = { path = "../rbs-transport", features = ["conformance"] }
# The interop test muxes real H.264 and AAC into MPEG-TS chunks, as the engine does.
rbs-mux = { path = "../rbs-mux" }
rbs-mux-mpegts = { path = "../rbs-mux-mpegts" }
rbs-media-format = { path = "../rbs-media-format" }
# Micro-benchmarks for the send path (measure-performance skill, ADR-0009).
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "send"
harness = false

[lints]
workspace = true
