[package]
name = "rbs-codec-opus"
description = "Opus audio encoder and decoder for RBS on a vendored libopus, built with the C compiler and no CMake."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
# The vendored libopus sources keep their own BSD-3-Clause licence file (vendor/libopus/COPYING).
build = "build.rs"

[dependencies]
rbs-core = { path = "../rbs-core" }
rbs-codec = { path = "../rbs-codec" }

[build-dependencies]
cc = "1"

[dev-dependencies]
rbs-codec = { path = "../rbs-codec", features = ["conformance"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "opus"
harness = false

[lints]
workspace = true
