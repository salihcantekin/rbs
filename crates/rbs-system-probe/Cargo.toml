[package]
name = "rbs-system-probe"
description = "OS adapter for recording protection (ADR-0090): free space and volume of a folder, and available system memory."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

# Adapter (docs/architecture/overview.md#layers): plain functions over OS calls and no
# other RBS crate. The composition roots implement `rbs_record::protection::SystemProbe`
# over them (ADR-0090 decision 11).
[dependencies]

[target.'cfg(unix)'.dependencies]
# statvfs; the version the workspace already builds.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The version Slint and wgpu already build.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }

[lints]
workspace = true
