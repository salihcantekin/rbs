[package]
name = "rbs-system-probe"
description = "Read-only OS information shared by adapters and composition roots: free space and volume of a folder and available memory for recording protection (ADR-0090), and which app holds the OS privacy grants (ADR-0141)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

# Adapter support (docs/architecture/overview.md#layers; ADR-0090 decision 11): plain
# functions that read OS information and never change OS state, no other RBS crate, and
# `libc` and `windows-sys` only (`cargo xtask check-layers`). Adapters (ADR-0141) and the
# composition roots use it. The composition roots implement `rbs_record::protection::SystemProbe`
# over them (ADR-0090 decision 11).
[dependencies]

[target.'cfg(unix)'.dependencies]
# statvfs; the version the workspace already builds.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The version Slint and wgpu already build.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Registry"] }

[lints]
workspace = true
