[package]
name = "rbs-gpu"
description = "GPU context, texture pool, compositor and encoder colour conversion for RBS (wgpu, ADR-0005)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rbs-core = { path = "../rbs-core" }
# Engine to engine: compositor nodes and the render runtime implement the graph's node
# contract (ADR-0020); rbs-graph never names wgpu.
rbs-graph = { path = "../rbs-graph" }
# Engine layer may depend on wgpu (docs/architecture/overview.md#layers). Web backends are not needed.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"
# Recycled frame buffers of the system-memory download (`BytesMut`); already in the
# graph through rbs-core.
bytes = "1.9"

[features]
# UI-process code: shows the cross-process preview as a native layer of a window: a Core
# Animation layer on macOS (ADR-0034), a DirectComposition visual with a composition
# swapchain on Windows (ADR-0036). Off by default so engine binaries carry no window code
# (P8); the UI (rbs-app) turns it on.
preview-layer = [
    "dep:objc2",
    "dep:objc2-quartz-core",
    "dep:objc2-core-graphics",
    "dep:windows-numerics",
    "windows/Win32_Graphics_CompositionSwapchain",
    "windows/Win32_Graphics_Direct3D",
    "windows/Win32_Graphics_Direct3D11",
    "windows/Win32_Graphics_DirectComposition",
    "windows/Win32_Graphics_Dxgi",
    "windows/Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
# Same version as the dependency; listed again so benches can name wgpu types directly.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
criterion = { version = "0.7", default-features = false }

[[bench]]
name = "compositor"
harness = false

[[bench]]
name = "preview"
harness = false

[[bench]]
name = "transfer"
harness = false

[[test]]
name = "share_layer_metal"
required-features = ["preview-layer"]

[lints]
workspace = true

# Native surface import on Windows goes through wgpu's D3D12 HAL; same `windows` version as wgpu-hal.
# The cross-process preview (ADR-0036) adds named pipes, overlapped I/O, handle duplication
# and the system CSPRNG for its token.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
# The layer's visual transform (feature `preview-layer`); the version `windows` already
# builds, so the lockfile gains no crate.
windows-numerics = { version = "0.3.1", optional = true }

[target.'cfg(windows)'.dev-dependencies]
# Test-only D3D11 producer for the import conformance test.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }

# Native surface import on macOS goes through wgpu's Metal HAL; same objc2 versions as wgpu-hal.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLAllocation", "MTLDevice", "MTLPixelFormat", "MTLResource", "MTLTexture", "objc2-io-surface"] }
objc2-io-surface = { version = "0.3.2", default-features = false, features = ["std", "IOSurfaceRef", "IOSurfaceTypes", "libc", "objc2-core-foundation"] }
# Property dictionaries for creating the bi-planar IOSurfaces of the encoder export.
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
# The preview as a Core Animation layer (share::PreviewLayer, ADR-0034, feature
# `preview-layer`); same objc2 versions as wgpu-hal and raw-window-metal, so nothing new
# is built.
objc2 = { version = "0.6.3", optional = true }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CATransaction", "objc2-core-foundation", "objc2-core-graphics"], optional = true }
# Colours of the marks drawn over the preview (ADR-0048); already in the lockfile through
# rbs-app.
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColor"], optional = true }
# Mach messages and bootstrap lookups for the cross-process preview (ADR-0028).
mach2 = "0.7"

[target.'cfg(target_vendor = "apple")'.dev-dependencies]
# Test-only: reads a PreviewLayer's contents back as an IOSurface.
objc2 = "0.6.3"
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "objc2-core-foundation"] }
# Test-only IOSurface producer for the import conformance test.
objc2-io-surface = { version = "0.3.2", default-features = false, features = ["std", "IOSurfaceRef", "IOSurfaceTypes", "libc", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
# Test-only consumer check: exported surfaces must wrap as CVPixelBuffers for VideoToolbox.
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferIOSurface", "CVReturn", "objc2-io-surface"] }

# Sync-file waits on Vulkan: wgpu does not enable VK_KHR_external_semaphore_fd, so the
# importer loads it itself (same ash version as wgpu-hal), and checks sync files with poll.
[target.'cfg(target_os = "linux")'.dependencies]
ash = { version = "0.38", default-features = false, features = ["std"] }
libc = "0.2.180"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Test-only udmabuf producer for the DMA-BUF import test (memfd + ioctl).
libc = "0.2.180"
