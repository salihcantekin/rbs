"color.meter.high" = "#ff9f43"
"color.meter.clip" = "#e9a6ff"

# Logical pixels at 100 % scale.
[length]
"space.1" = 4
"space.2" = 8
"space.3" = 12
"space.4" = 16
"space.6" = 24
"space.8" = 32
# Properties-style panels: padding round the content, gap between sections, gap between
# fields. A theme may not go below the minimums (ADR-0076), whatever it does to space.*.
"size.panel.pad" = 12
"size.section.gap" = 16
"size.field.gap" = 8
# Short NumberField for insets and bar thickness (about four digits plus steppers).
"size.field.compact" = 96
# Thickness of the chosen tab's underline.
"size.tab.indicator" = 2
"size.control.sm" = 24
"size.control.md" = 28
"size.control.lg" = 32
# Width of a colour code field: #rrggbbaa and the copy button that appears on it.
"size.color.code" = 128
"radius.sm" = 4
"radius.md" = 6
"radius.lg" = 12
"size.border" = 1
"size.focus-ring" = 2
"size.icon.box" = 16
"size.icon.stroke" = 1.5
"size.menu.sm" = 220
"size.menu.md" = 300
# A setting row narrower than this puts its control under its name (ADR-0114).
"size.row.stack-below" = 280
# Height of a picture at the start of a ListRow (16:9 well): small, medium, large.
"size.row.picture.sm" = 24
"size.row.picture.md" = 36
"size.row.picture.lg" = 54
"size.select.list-h" = 320
"size.app-menu.w" = 600
"size.app-menu.categories" = 165
"size.app-menu.list-h" = 450
"size.caption.w" = 46
"size.window.w" = 1440
"size.window.h" = 900
"size.window.min-w" = 1280
"size.window.min-h" = 720
"size.floating.w" = 640
"size.floating.h" = 420
"size.settings.w" = 920
"size.settings.h" = 680
"step.nudge" = 8
"step.nudge-large" = 128
# Letter spacing of uppercase section titles.
"size.tracking.caps" = 0.5
# Width of the peak hold marker in a level bar.
"size.meter.peak" = 2
# Thickness of a level bar (its short side), so the low, mid and high zones read as bands.
"size.meter.bar" = 12
# Font size of the dB scale under the Mixer faders, and the height of that row.
# Smaller than type.caption: the scale is a tick label, and the fader and the readout
# stay the level's other cues. Not a text style: those cannot go below 11.
"size.meter.scale" = 9
"size.meter.scale-line" = 12
# Fixed width of a level readout ("0 dB", "−60.0 dB", "Silent") beside a fader.
"size.meter.readout" = 56
# Width of one Mixer column strip (columns): padding + meter + VSlider + control column.
# Must stay tight; the VSlider must not horizontal-stretch (its track is centred in its width).
"size.mixer.strip" = 104
# Drag handle between This scene and Global panes in the Mixer columns layout (reserved).
"size.mixer.splitter" = 6
# Width of the columns strip's control column (level readout above the icon buttons).
"size.mixer.controls" = 48
# Minimum height of a columns strip: panel pad is outside this box. Inside it,
# top pad + name + gap + five control slots + bottom pad
# (space.1 + control.sm + space.1 + 5*control.sm + 4*space.1 + space.1).
# A shorter Mixer scrolls; the fader track stays at least as tall as that control column.
"size.mixer.min-h" = 172
# Transition panel widths: below `narrow` only the button shows, below `short`
# the button says "Go" and the studio mode hint is hidden.
"size.transition.narrow" = 40
"size.transition.short" = 120
"size.transition.between" = 100
# Rail width up to which the rail between the pictures shows icons only.
"size.transition.icons" = 120
"size.transition.below" = 44
"size.transition.min-picture" = 160
"size.transition.min-h" = 240
"size.transition.type" = 112
"size.transition.type-min" = 72
"size.transition.duration" = 88
"size.transition.compact" = 600
# Library panel: a sample picture's thumbnail (16:9).
# Add-grid picture: at most this wide and this tall, so two columns fit a narrow
# panel and a long grid stays short (16:9, capped).
"size.library.thumb-w" = 96
"size.library.thumb-h" = 48
# Source tab: a window or display's picture in front of its name in the target list (16:9).
"size.target.thumb-w" = 96
"size.target.thumb-h" = 54
# Notice card: the outline, the side mark plus the countdown bar, and the widest
# the card may be. A longer message elides; the card never grows with the window.
"size.toast.border" = 2
"size.toast.rail" = 4
"size.toast.max" = 480

# Milliseconds. Every animation is off under "reduce motion".
[duration]
"motion.fast" = 120
"motion.normal" = 180
# Not motion, so not off under "reduce motion": a held stepper button waits
# `delay.repeat-start`, then steps every `delay.repeat`.
"delay.repeat-start" = 400
"delay.repeat" = 80
# Not motion: how long the pointer rests on a control before its tooltip shows.
"delay.tooltip" = 500
# Not motion: how long a toast stays before it closes, and how often the time left steps.
"delay.toast" = 8000
"delay.toast-tick" = 1000

# Size and line height in logical pixels, weight 100-900.
[type]
"type.caption" = { size = 12, line = 16, weight = 400 }
"type.body" = { size = 13, line = 20, weight = 400 }
"type.label" = { size = 13, line = 20, weight = 500 }
"type.title" = { size = 15, line = 22, weight = 600 }
"type.heading" = { size = 20, line = 28, weight = 600 }

# Font families in order of preference; the first one installed is used.
# Empty: the OS UI font.
[font]
"font.family" = []
