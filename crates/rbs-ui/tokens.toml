# RBS design tokens (docs/specs/ui-design-system.md, "Tokens").
# The single source of visual values. Shells generate their toolkit format from
# this file; UI code refers to tokens by name only (rule U6). Values are initial
# and are tuned in usability testing; names are a contract.
format = 2

# Live and recording colours are the same in every theme (rule U12): themes cannot change them.
[fixed]
"color.state.live" = "#c4262e"
"color.text.on-live" = "#ffffff"
# The Windows close button's hover, as the OS draws it (ADR-0071): fixed as well.
"color.caption.close-hover" = "#c42b1c"
"color.caption.close-text" = "#ffffff"

[themes.dark]
"color.surface.base" = "#0b0b0d"
"color.surface.raised" = "#1c1d21"
"color.surface.overlay" = "#27282d"
"color.surface.sunken" = "#0f1012"
# Notice card: a blue fill and a light edge, so it does not blend into the grey panels.
"color.toast.surface" = "#1a2030"
"color.toast.edge" = "#d6e4ff"
"color.text.primary" = "#eceef2"
"color.text.secondary" = "#a8afbb"
"color.text.disabled" = "#6b717c"
"color.text.inverse" = "#0c0e10"
"color.border.subtle" = "#303136"
"color.border.strong" = "#6e7683"
"color.border.focus" = "#6ea8ff"
"color.accent" = "#5b9cff"
"color.accent.hover" = "#7fb2ff"
"color.accent.subtle" = "#1d2b44"
"color.brand" = "#8a63ff"
"color.state.warning" = "#e3b341"
"color.state.healthy" = "#3fb950"
"color.state.error" = "#c38bf0"
"color.action.destructive" = "#c38bf0"
"color.meter.low" = "#3fb950"
"color.meter.mid" = "#e3b341"
"color.meter.high" = "#f0883e"
"color.meter.clip" = "#c38bf0"

[themes.light]
"color.surface.base" = "#ececf0"
"color.surface.raised" = "#ffffff"
"color.surface.overlay" = "#e0e1e7"
"color.surface.sunken" = "#f1f1f4"
"color.toast.surface" = "#ffffff"
"color.toast.edge" = "#0a4db8"
"color.text.primary" = "#15171a"
"color.text.secondary" = "#4f555e"
"color.text.disabled" = "#9aa0a8"
"color.text.inverse" = "#ffffff"
"color.border.subtle" = "#d0d3da"
"color.border.strong" = "#7a808a"
"color.border.focus" = "#1f6feb"
"color.accent" = "#1f6feb"
"color.accent.hover" = "#1a5fcc"
"color.accent.subtle" = "#dbe7fd"
"color.brand" = "#5326d9"
"color.state.warning" = "#9a6700"
"color.state.healthy" = "#1a7f37"
"color.state.error" = "#8e3fb5"
"color.action.destructive" = "#8e3fb5"
"color.meter.low" = "#1a7f37"
"color.meter.mid" = "#9a6700"
"color.meter.high" = "#bc4c00"
"color.meter.clip" = "#8e3fb5"

[themes.high-contrast]
"color.surface.base" = "#000000"
"color.surface.raised" = "#0a0a0a"
"color.surface.overlay" = "#141414"
"color.surface.sunken" = "#000000"
"color.toast.surface" = "#0a0a0a"
"color.toast.edge" = "#8ad4ff"
"color.text.primary" = "#ffffff"
"color.text.secondary" = "#e6e6e6"
"color.text.disabled" = "#9a9a9a"
"color.text.inverse" = "#000000"
"color.border.subtle" = "#8a8a8a"
"color.border.strong" = "#ffffff"
"color.border.focus" = "#ffd60a"
"color.accent" = "#4cc2ff"
"color.accent.hover" = "#8ad8ff"
"color.accent.subtle" = "#00314d"
"color.brand" = "#a98bff"
"color.state.warning" = "#ffd60a"
"color.state.healthy" = "#5cff7a"
"color.state.error" = "#e9a6ff"
"color.action.destructive" = "#e9a6ff"
