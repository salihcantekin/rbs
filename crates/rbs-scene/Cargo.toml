[package]
name = "rbs-scene"
description = "RBS scene collection: canvases, sources, scenes and items, validated edits with undo, and flattening into compositor layers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rbs-core = { path = "../rbs-core" }
rbs-graph = { path = "../rbs-graph" }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "edit"
harness = false

[lints]
workspace = true
