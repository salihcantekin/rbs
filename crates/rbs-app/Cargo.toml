[package]
name = "rbs-app"
description = "The RBS desktop app: a native Slint shell that renders the rbs-ui panel, layout and workspace model."
version.workspace = true
edition.workspace = true
# Slint 1.18 needs Rust 1.92 (ADR-0022, decision 6). Engine and port crates keep the workspace minimum.
rust-version = "1.92"
repository.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rbs"
path = "src/main.rs"

[dependencies]
rbs-ui = { path = "../rbs-ui" }
# Exact pin (ADR-0022, decision 5). Skia renderer (decision 1). `unstable-wgpu-30`
# lets the preview display engine surfaces imported on rbs-gpu's device (decision 2,
# ADR-0028); it must track rbs-gpu's wgpu major.
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-skia", "accessibility", "compat-1-2", "unstable-wgpu-30"] }

[dev-dependencies]
# The cross-process preview demo (examples/remote_preview.rs) imports engine surfaces.
rbs-gpu = { path = "../rbs-gpu", features = ["preview-layer"] }
rbs-core = { path = "../rbs-core" }
# The demo attaches the preview layer to the window's view (ADR-0034). Same pin as above;
# the feature only reaches example and test builds.
slint = { version = "=1.18.1", default-features = false, features = ["raw-window-handle-06"] }
raw-window-handle = "0.6"

[target.'cfg(target_vendor = "apple")'.dev-dependencies]
# The demo's self-measurement reads process CPU time (getrusage).
libc = "0.2.180"

[build-dependencies]
rbs-ui = { path = "../rbs-ui" }
slint-build = "=1.18.1"

[lints]
workspace = true
