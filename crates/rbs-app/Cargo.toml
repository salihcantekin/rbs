[package]
name = "rbs-app"
description = "The RBS desktop app: a native Slint shell that renders the rbs-ui panel, layout and workspace model."
version.workspace = true
edition.workspace = true
# Slint 1.18 needs Rust 1.92 (ADR-0022, decision 6). Engine and port crates keep the workspace minimum.
rust-version = "1.92"
repository.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rbs"
path = "src/main.rs"

[features]
# `RBS_DEMO_SOURCES=1` adds the deterministic reference adapters (synthetic displays,
# cameras and audio), for screenshots and UI checks on machines without devices. Off
# in normal builds.
demo-sources = ["dep:rbs-capture-test", "dep:rbs-audio-io-test"]

[dependencies]
rbs-ui = { path = "../rbs-ui" }
# Exact pin (ADR-0022, decision 5). Skia renderer (decision 1). `unstable-wgpu-30`
# lets the preview display engine surfaces imported on rbs-gpu's device (decision 2,
# ADR-0028); it must track rbs-gpu's wgpu major.
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-skia", "accessibility", "compat-1-2", "unstable-wgpu-30", "raw-window-handle-06"] }
# The Program panel attaches the preview layer to the window (ADR-0034, ADR-0036).
raw-window-handle = "0.6"
# The recording settings file (src/record_profile.rs); the versions rbs-ui already uses.
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# Local time for recording file names; already built by Slint with these features.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Application layer: a composition root (ADR-0041 decision 7). The studio runs in this
# process on its own control thread; with rbs-cli, this is the only place that names
# adapters (P1, src/platform.rs).
rbs-core = { path = "../rbs-core" }
rbs-engine = { path = "../rbs-engine" }
rbs-graph = { path = "../rbs-graph" }
rbs-gpu = { path = "../rbs-gpu", features = ["preview-layer"] }
rbs-audio = { path = "../rbs-audio" }
rbs-scene = { path = "../rbs-scene" }
rbs-sources = { path = "../rbs-sources" }
# CaptureError::Cancelled from OS pickers.
rbs-capture = { path = "../rbs-capture" }
rbs-record = { path = "../rbs-record" }
rbs-thread-os = { path = "../rbs-thread-os" }
rbs-mux-matroska = { path = "../rbs-mux-matroska" }
rbs-mux-fmp4 = { path = "../rbs-mux-fmp4" }
rbs-transport-file = { path = "../rbs-transport-file" }
# Go live (src/stream_profile.rs): the stream's URL, secret and reconnect policy, and
# the pure-Rust stream adapters every platform registers, as `rbs-cli stream` does.
rbs-transport = { path = "../rbs-transport" }
rbs-transport-rtmp = { path = "../rbs-transport-rtmp" }
rbs-transport-srt = { path = "../rbs-transport-srt" }
rbs-mux-mpegts = { path = "../rbs-mux-mpegts" }
rbs-codec = { path = "../rbs-codec" }
# The control API (ADR-0044): the control thread serves its requests.
rbs-api = { path = "../rbs-api" }
# Remote control: the control API over WebSocket on loopback (src/remote_control.rs).
rbs-api-ws = { path = "../rbs-api-ws" }
# Remote control for programs of the same user, such as `rbs-cli token`: local IPC.
rbs-api-ipc = { path = "../rbs-api-ipc" }
# Remote control settings and the config directory, shared with rbs-cli.
rbs-remote-settings = { path = "../rbs-remote-settings" }
rbs-capture-test = { path = "../rbs-capture-test", optional = true }
rbs-audio-io-test = { path = "../rbs-audio-io-test", optional = true }

[target.'cfg(windows)'.dependencies]
# The stream key in the Windows Credential Manager (src/stream_key.rs).
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
rbs-capture-wgc = { path = "../rbs-capture-wgc" }
rbs-capture-mf = { path = "../rbs-capture-mf" }
rbs-audio-io-wasapi = { path = "../rbs-audio-io-wasapi" }
rbs-codec-nvenc = { path = "../rbs-codec-nvenc" }
rbs-codec-amf = { path = "../rbs-codec-amf" }
rbs-codec-mf = { path = "../rbs-codec-mf" }

[target.'cfg(target_os = "linux")'.dependencies]
rbs-capture-pipewire = { path = "../rbs-capture-pipewire" }
rbs-audio-io-pipewire = { path = "../rbs-audio-io-pipewire" }
rbs-codec-nvenc = { path = "../rbs-codec-nvenc" }
rbs-codec-amf = { path = "../rbs-codec-amf" }
rbs-codec-qsv = { path = "../rbs-codec-qsv" }
rbs-codec-vaapi = { path = "../rbs-codec-vaapi" }
rbs-codec-ffmpeg = { path = "../rbs-codec-ffmpeg" }

# Audio meters as Core Animation layers (src/native, ADR-0035). Same objc2 versions as
# wgpu-hal, raw-window-metal and rbs-gpu's preview layer, so nothing new is built.
[target.'cfg(target_os = "macos")'.dependencies]
# The stream key in the macOS Keychain (src/stream_key.rs).
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
objc2 = "0.6.3"
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CATransaction", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColor"] }
# The platform's adapters (src/platform.rs).
rbs-capture-sck = { path = "../rbs-capture-sck" }
rbs-capture-avf = { path = "../rbs-capture-avf" }
rbs-audio-io-coreaudio = { path = "../rbs-audio-io-coreaudio" }
rbs-codec-videotoolbox = { path = "../rbs-codec-videotoolbox" }
rbs-codec-audiotoolbox = { path = "../rbs-codec-audiotoolbox" }

[dev-dependencies]
# The control API tests read JSON-RPC answers (tests/studio_api.rs, studio_stream.rs).
serde_json = "1"
# Reference adapters for the studio host tests (deterministic, no devices).
rbs-capture-test = { path = "../rbs-capture-test" }
rbs-audio-io-test = { path = "../rbs-audio-io-test" }
# The audio graph check (examples/audio_graph.rs) is a composition root: it wires the
# platform's audio and AAC adapters into the engine. Every one builds on every platform.
rbs-audio-io = { path = "../rbs-audio-io" }
rbs-audio-io-coreaudio = { path = "../rbs-audio-io-coreaudio" }
rbs-audio-io-wasapi = { path = "../rbs-audio-io-wasapi" }
rbs-codec = { path = "../rbs-codec" }
rbs-mux = { path = "../rbs-mux" }
rbs-codec-audiotoolbox = { path = "../rbs-codec-audiotoolbox" }
rbs-codec-mf = { path = "../rbs-codec-mf", features = ["testing"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# The meter layer test reads the bridge's sublayers.
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray"] }

[target.'cfg(target_vendor = "apple")'.dev-dependencies]
# The demo's self-measurement reads process CPU time (getrusage).
libc = "0.2.180"

[target.'cfg(windows)'.dev-dependencies]
# The demo's self-measurement reads process CPU time and peak working set; the version
# rbs-gpu and wgpu-hal already build.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[build-dependencies]
rbs-ui = { path = "../rbs-ui" }
slint-build = "=1.18.1"

[lints]
workspace = true
