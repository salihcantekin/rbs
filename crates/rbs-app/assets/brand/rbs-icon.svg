      <stop offset="0.52" stop-color="#7B50F6"/>
      <stop offset="1" stop-color="#4E23D1"/>
    </linearGradient>
    <linearGradient id="bevel" x1="48" y1="36" x2="208" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D8C8FF" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#D8C8FF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#280D78" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
