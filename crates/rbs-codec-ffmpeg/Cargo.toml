[package]
name = "rbs-codec-ffmpeg"
description = "FFmpeg (libavcodec) adapter for the RBS encoder port: AAC-LC on Linux, loaded at run time."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[features]
# A fake encoder engine behind the same session, so the port suite and the
# adapter's behaviour tests run on every platform (as in rbs-codec-mf).
testing = []

[dependencies]
rbs-codec = { path = "../rbs-codec" }
rbs-core = { path = "../rbs-core" }
# AudioSpecificConfig for the stream extradata (ADR-0019, decision 7).
rbs-media-format = { path = "../rbs-media-format" }

# libavcodec and libavutil are opened at run time (ADR-0007: linked dynamically), so
# building needs no FFmpeg headers and a machine without FFmpeg probes to nothing.
[target.'cfg(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
libloading = "0.8.9"

[dev-dependencies]
rbs-codec = { path = "../rbs-codec", features = ["conformance"] }
rbs-codec-ffmpeg = { path = ".", features = ["testing"] }
rbs-media-format = { path = "../rbs-media-format" }
# Micro-benchmarks for the encode path (measure-performance skill, ADR-0009).
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "encode"
harness = false

[lints]
workspace = true
