[package]
name = "rbs-transport-rtmp"
description = "RTMP transport adapter for RBS: publishes H.264 and AAC packets to an RTMP server from its own I/O thread."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rbs-core = { path = "../rbs-core" }
rbs-transport = { path = "../rbs-transport" }
# FLV tag bodies and AMF0, shared with the FLV muxer (ADR-0019, decision 7).
rbs-media-format = { path = "../rbs-media-format" }
# Wait-free single-producer single-consumer ring for the hand-off to the I/O thread
# (output-ports spec, "Threading"; P6). MIT or Apache-2.0, no dependencies. Already
# used by rbs-transport-file.
rtrb = "0.4"

[dev-dependencies]
rbs-transport = { path = "../rbs-transport", features = ["conformance"] }
# Micro-benchmarks for the send path (measure-performance skill, ADR-0009).
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "send"
harness = false

[lints]
workspace = true
