[package]
name = "rbs-transport-rtmp"
description = "RTMP transport adapter for RBS: publishes H.264 and AAC packets to an RTMP server from its own I/O thread."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rbs-core = { path = "../rbs-core" }
rbs-transport = { path = "../rbs-transport" }
# FLV tag bodies and AMF0, shared with the FLV muxer (ADR-0019, decision 7).
rbs-media-format = { path = "../rbs-media-format" }
# Wait-free single-producer single-consumer ring for the hand-off to the I/O thread
# (output-ports spec, "Threading"; P6). MIT or Apache-2.0, no dependencies. Already
# used by rbs-transport-file.
rtrb = "0.4"
# TLS for `rtmps://` (ADR-0127 decision 10), on the I/O thread only. The ring provider,
# as rbs-api-ws uses (no aws-lc-rs). MIT, Apache-2.0 or ISC.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# Verifies server certificates with the operating system's trust store, so roots a
# company or user installs are honoured and no bundled list ages (ADR-0127 decision
# 10). MIT or Apache-2.0.
rustls-platform-verifier = "0.7"

[dev-dependencies]
# A test certificate authority and server certificate for the RTMPS tests.
rcgen = { version = "0.14.7", default-features = false, features = ["ring", "pem"] }
rbs-transport = { path = "../rbs-transport", features = ["conformance"] }
# Micro-benchmarks for the send path (measure-performance skill, ADR-0009).
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "send"
harness = false

[lints]
workspace = true
