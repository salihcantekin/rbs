# TEMPORARY experiment (deleted before any PR): UDP receive-timeout loss on Windows.
name: exp udp close
on:
  push:
    branches: [claude/project-thread-f59gxt]
concurrency:
  group: exp-udp
  cancel-in-progress: true
jobs:
  exp:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
          save-if: false
      - name: build
        run: cargo test --release -p rbs-transport-srt --test exp_udp_timeout --no-run
      - name: alone
        shell: bash
        run: cargo test --release -p rbs-transport-srt --test exp_udp_timeout -- --ignored --nocapture 2>&1 | grep RESULT
      - name: four at once (load)
        shell: bash
        run: |
          for i in 1 2 3 4; do (cargo test --release -p rbs-transport-srt --test exp_udp_timeout -- --ignored --nocapture 2>&1 | grep RESULT) & done; wait
