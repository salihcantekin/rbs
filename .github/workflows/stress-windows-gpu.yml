# TEMPORARY (removed before merge): runs the Windows fast and slow tiers repeatedly with
# the `gpu-windows` test group at 2 and 4 threads, to show the change adds no flakes.
name: stress windows gpu group

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  RBS_REQUIRE_GPU: "1"
  RBS_REQUIRE_D3D12: "1"
  RBS_SRT_DEBUG: "1"

jobs:
  stress:
    name: stress (threads ${{ matrix.threads }}, runner ${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        threads: [2, 4]
        runner: [1, 2, 3]
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: set the group's threads
        shell: bash
        run: sed -i 's/^gpu-windows = { max-threads = [0-9]* }/gpu-windows = { max-threads = ${{ matrix.threads }} }/' .config/nextest.toml && grep gpu-windows .config/nextest.toml
      - name: build
        run: cargo nextest run --workspace --profile ci --no-run
      - name: run both tiers 6 times, no retries
        shell: bash
        run: |
          fails=0
          for i in 1 2 3 4 5 6; do
            start=$SECONDS
            if ! cargo nextest run --workspace --profile ci --no-tests=pass > "run-$i.log" 2>&1; then
              fails=$((fails+1)); echo "RUN $i FAST TIER FAILED"; grep -E "FAIL|TIMEOUT|SIGSEGV|ABORT|DEBUG|recent" "run-$i.log" | head -60
            fi
            grep -E "Summary" "run-$i.log" | sed 's/\x1b\[[0-9;]*m//g'
            if ! cargo nextest run --workspace --profile ci --run-ignored only --no-tests=pass -E 'test(/^slow_/)' > "slow-$i.log" 2>&1; then
              fails=$((fails+1)); echo "RUN $i SLOW TIER FAILED"; grep -E "FAIL|TIMEOUT" "slow-$i.log" | head -20
            fi
            echo "run $i: $((SECONDS-start)) s"
          done
          echo "failed runs: $fails"
          [ "$fails" -eq 0 ]
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.threads }}-${{ matrix.runner }}
          path: "*.log"
