# TEMPORARY: measures where the macOS test build spends its time. Deleted before merge.
name: tmp macOS build timing

on:
  push:
    branches: [claude/project-thread-fi2sqh]
    paths: [.github/workflows/tmp-macos-build-timing.yml]

concurrency:
  group: tmp-macos-build-timing
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # Same job id as ci.yml so rust-cache restores main's `check` cache.
  check:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: machine
        run: sysctl -n hw.ncpu hw.memsize machdep.cpu.brand_string; sw_vers; ld -v 2>&1 | head -2
      - name: baseline build (as CI)
        run: |
          start=$(date +%s)
          cargo build --workspace --tests --timings
          echo "baseline: $(( $(date +%s) - start )) s"
          mkdir -p timings && cp target/cargo-timings/cargo-timing.html timings/baseline.html
      - name: rbs-app only, rebuild, with linker timing
        run: |
          cargo clean -p rbs-app -p rbs-cli
          start=$(date +%s)
          cargo build -p rbs-app --tests --timings
          echo "rbs-app rebuild: $(( $(date +%s) - start )) s"
          cp target/cargo-timings/cargo-timing.html timings/rbs-app.html
          ls -la target/debug/deps/ | sort -k5 -n | tail -20
      - name: rbs-app without debug info
        run: |
          cargo clean -p rbs-app -p rbs-cli
          start=$(date +%s)
          cargo build -p rbs-app --tests --timings --config 'profile.dev.package.rbs-app.debug=0'
          echo "rbs-app debug=0: $(( $(date +%s) - start )) s"
          cp target/cargo-timings/cargo-timing.html timings/rbs-app-nodebug.html
      - name: rbs-app with 64 codegen units
        run: |
          cargo clean -p rbs-app -p rbs-cli
          start=$(date +%s)
          cargo build -p rbs-app --tests --timings --config 'profile.dev.package.rbs-app.codegen-units=64'
          echo "rbs-app cgu=64: $(( $(date +%s) - start )) s"
          cp target/cargo-timings/cargo-timing.html timings/rbs-app-cgu64.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timings
          path: timings/
