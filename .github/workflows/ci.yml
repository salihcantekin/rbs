name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its older, now outdated run. Runs on main are
# never cancelled, so every merge leaves a complete run (and a fresh cache) behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Line tables only: backtraces and panic locations keep file and line, but the
  # target directory, the cache and link times shrink (full debug info on Windows
  # made a 2.4 GB cache that took minutes to compress and upload).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      # Panics must stay catchable at the app's boundaries (ADR-0055 decision 1).
      - name: no panic = "abort"
        run: |
          if grep -rnE --include=Cargo.toml '^\s*panic\s*=\s*"abort"' . ||
             grep -rnsE 'panic=abort' .cargo/; then
            echo 'panic = "abort" breaks the panic boundaries of ADR-0055'; exit 1
          fi

  deny:
    name: dependency bans and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses

  # Tests and lints run as separate jobs per platform so they run side by side: the test
  # job is the critical path and no longer waits for clippy and rustdoc. The job id
  # `check` is kept so it keeps restoring the cache main already saved under that id.
  check:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A hung test is killed by nextest after 60 s; this bounds everything else.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # Documentation-only pull requests skip every step below (RBS_CODE=false).
      - name: what changed
        shell: bash
        run: bash .github/scripts/code-changed.sh
      - if: env.RBS_CODE == 'true'
        uses: dtolnay/rust-toolchain@stable
      # Only main saves the cache; pull requests restore main's. Saving per pull request
      # cost minutes per run on Windows and evicted main's cache (10 GB repo limit).
      - if: env.RBS_CODE == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Per-test timeouts, no retries and per-test timings (ADR-0032, .config/nextest.toml).
      - if: env.RBS_CODE == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # The .deb files are cached (main saves them) because the mirror is sometimes slow.
      # Keyed by runner image and package list, so each new image starts a fresh cache.
      - if: runner.os == 'Linux' && env.RBS_CODE == 'true'
        id: apt-key
        run: echo "key=apt-${{ runner.os }}-$ImageOS-$ImageVersion-${{ hashFiles('.github/scripts/apt-install.sh') }}" >> "$GITHUB_OUTPUT"
      - if: runner.os == 'Linux' && env.RBS_CODE == 'true'
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-key.outputs.key }}
          # A new runner image starts from the previous image's packages; apt then
          # downloads only what changed.
          restore-keys: apt-${{ runner.os }}-
      - if: runner.os == 'Linux' && env.RBS_CODE == 'true'
        run: bash .github/scripts/apt-install.sh ~/apt-archives
      - if: runner.os == 'Linux' && env.RBS_CODE == 'true' && github.ref == 'refs/heads/main' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - if: runner.os == 'Linux' && env.RBS_CODE == 'true'
        name: start a private PipeWire daemon
        run: |
          dir="$RUNNER_TEMP/pipewire"
          mkdir -m 700 -p "$dir"
          echo "XDG_RUNTIME_DIR=$dir" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="$dir"
          nohup pipewire > "$RUNNER_TEMP/pipewire.log" 2>&1 &
          for _ in $(seq 50); do [ -S "$dir/pipewire-0" ] && break; sleep 0.1; done
          [ -S "$dir/pipewire-0" ] || { cat "$RUNNER_TEMP/pipewire.log"; exit 1; }
          nohup dbus-run-session -- wireplumber > "$RUNNER_TEMP/wireplumber.log" 2>&1 &
          # WirePlumber is ready once it shows up as a client of the daemon.
          for _ in $(seq 100); do pw-cli ls Client 2>/dev/null | grep -qi wireplumber && break; sleep 0.1; done
          pw-cli ls Client | grep -qi wireplumber || { cat "$RUNNER_TEMP/wireplumber.log"; exit 1; }
      - if: env.RBS_CODE == 'true'
        name: fast tests
        shell: bash
        run: |
          cargo nextest run --workspace --profile ci --no-tests=pass
          cp target/nextest/ci/junit.xml fast-junit.xml
        env:
          # Every runner has a GPU adapter (lavapipe, WARP, Metal); GPU tests must not skip.
          RBS_REQUIRE_GPU: "1"
          RBS_REQUIRE_D3D12: ${{ runner.os == 'Windows' && '1' || '' }}
          RBS_REQUIRE_NV12_SURFACE: ${{ runner.os == 'Linux' && '1' || '' }}
          RBS_REQUIRE_PIPEWIRE: ${{ runner.os == 'Linux' && '1' || '' }}
          RBS_REQUIRE_VIDEOTOOLBOX: ${{ runner.os == 'macOS' && '1' || '' }}
      # The slow tier: `#[ignore = "slow: ..."]` tests named `slow_*`. Other ignored tests
      # (child-process helpers, tool-dependent `ffmpeg_interop`) are not selected.
      - if: env.RBS_CODE == 'true'
        name: slow tests
        shell: bash
        run: >-
          cargo nextest run --workspace --profile ci --run-ignored only --no-tests=pass
          -E 'test(/^slow_/)'
        env:
          RBS_REQUIRE_GPU: "1"
          RBS_REQUIRE_D3D12: ${{ runner.os == 'Windows' && '1' || '' }}
          RBS_REQUIRE_NV12_SURFACE: ${{ runner.os == 'Linux' && '1' || '' }}
          RBS_REQUIRE_PIPEWIRE: ${{ runner.os == 'Linux' && '1' || '' }}
          RBS_REQUIRE_VIDEOTOOLBOX: ${{ runner.os == 'macOS' && '1' || '' }}
      - if: env.RBS_CODE == 'true'
        run: cargo test --workspace --doc
      - name: test timings
        if: always() && env.RBS_CODE == 'true'
        shell: bash
        run: >-
          python3 .github/scripts/slowest-tests.py "Slowest tests (${{ runner.os }})"
          fast-junit.xml target/nextest/ci/junit.xml

  lint:
    name: clippy, doc (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: what changed
        shell: bash
        run: bash .github/scripts/code-changed.sh
      - if: env.RBS_CODE == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Its own cache (check builds share nothing with test builds); only main saves it.
      - if: env.RBS_CODE == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The same .deb cache as the test job, which is the one that saves it; only the
      # build's headers and libraries are installed here.
      # Keyed by runner image and package list, so each new image starts a fresh cache.
      - if: runner.os == 'Linux' && env.RBS_CODE == 'true'
        id: apt-key
        run: echo "key=apt-${{ runner.os }}-$ImageOS-$ImageVersion-${{ hashFiles('.github/scripts/apt-install.sh') }}" >> "$GITHUB_OUTPUT"
      - if: runner.os == 'Linux' && env.RBS_CODE == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-key.outputs.key }}
          # A new runner image starts from the previous image's packages; apt then
          # downloads only what changed.
          restore-keys: apt-${{ runner.os }}-
      - if: runner.os == 'Linux' && env.RBS_CODE == 'true'
        run: bash .github/scripts/apt-install.sh ~/apt-archives --build-only
      - if: env.RBS_CODE == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - if: env.RBS_CODE == 'true'
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # Feature-gated modules (conformance suites) are public API too.
      - if: env.RBS_CODE == 'true'
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
