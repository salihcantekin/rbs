name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  deny:
    name: dependency bans and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses

  check:
    name: clippy, test, doc (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Software Vulkan (lavapipe) so rbs-gpu golden image tests run instead of skipping.
      # rbs-app (Slint, Skia renderer) links fontconfig and loads xkbcommon on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libfontconfig1-dev libxkbcommon-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          # Every runner has a GPU adapter (lavapipe, WARP, Metal); GPU tests must not skip.
          RBS_REQUIRE_GPU: "1"
          RBS_REQUIRE_D3D12: ${{ runner.os == 'Windows' && '1' || '' }}
          RBS_REQUIRE_NV12_SURFACE: ${{ runner.os == 'Linux' && '1' || '' }}
          RBS_REQUIRE_VIDEOTOOLBOX: ${{ runner.os == 'macOS' && '1' || '' }}
      # TEMPORARY (PR #54 measurements; removed before merge).
      - if: runner.os == 'macOS'
        run: cargo bench -p rbs-codec-audiotoolbox --bench encode -- --warm-up-time 1 --measurement-time 3
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # Feature-gated modules (conformance suites) are public API too.
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
