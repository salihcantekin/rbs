# Test runner settings (ADR-0032, docs/specs/testing-strategy.md).
#
# `cargo nextest run --workspace` runs the fast tier; add `--run-ignored only -E 'test(/^slow_/)'`
# for the slow tier. CI uses `--profile ci`. Plain `cargo test` keeps working.

# GPU and hardware-encoder tests share one device per machine. nextest runs each test in
# its own process, so without a limit dozens of processes open the device at once; the
# macOS runners' virtual Metal device then reports "Parent device is lost". One at a
# time keeps them deterministic; everything else still runs in parallel. The PipeWire
# adapters share the CI's private daemon, and the audio adapter's slow test changes the
# daemon's graph quantum and rate, so they run in the same group.
#
# Windows is the exception: every test process opens its own D3D12 device (WARP on the
# CI runners) and these packages share nothing else across processes (temporary
# directories and IPC pipe names carry the process id). Run one at a time, they
# were the whole Windows test run (130 s of 130 s), so there they run two at a time in
# their own group. Two, not more: on the 4-vCPU runners, four at a time made
# `rbs-record` `outputs_with_the_same_settings_share_the_encoders` take 36 s instead of
# 3 s (WARP renders on the CPU), close to its 20 s-per-step guard, and the whole fast
# tier took 60 s instead of 30 s. The first matching override wins, so the Windows one
# comes first.
#
# Every package whose tests open a GPU device belongs here. `rbs-filters` and `rbs-nodes`
# were missing: their GPU tests ran beside the group, so on Windows more than two WARP
# devices shared the 4 vCPUs and `rbs-filters` `alloc_per_frame` took 24 to 60 s
# (killed at 60 s once).
[test-groups]
gpu = { max-threads = 1 }
gpu-windows = { max-threads = 2 }

[[profile.default.overrides]]
platform = 'cfg(windows)'
filter = 'package(rbs-gpu) | package(rbs-filters) | package(rbs-nodes) | package(rbs-record) | package(rbs-app) | package(rbs-capture-sck) | package(rbs-capture-avf) | package(rbs-capture-mf) | package(rbs-capture-wgc) | package(rbs-capture-pipewire) | package(rbs-audio-io-pipewire) | package(/^rbs-codec-/)'
test-group = 'gpu-windows'

[[profile.default.overrides]]
filter = 'package(rbs-gpu) | package(rbs-filters) | package(rbs-nodes) | package(rbs-record) | package(rbs-app) | package(rbs-capture-sck) | package(rbs-capture-avf) | package(rbs-capture-mf) | package(rbs-capture-wgc) | package(rbs-capture-pipewire) | package(rbs-audio-io-pipewire) | package(/^rbs-codec-/)'
test-group = 'gpu'

[profile.default]
# A flaky test fails the run. It is fixed, never retried.
retries = 0
# Report a test still running after 15 s, kill it at 60 s: a hang fails fast instead
# of holding the job until the runner's own timeout.
slow-timeout = { period = "15s", terminate-after = 4 }
# A test that leaks a thread or child process holding stdout is reported, not waited on.
leak-timeout = "1s"

[profile.ci]
retries = 0
slow-timeout = { period = "15s", terminate-after = 4 }
leak-timeout = "1s"
# Run everything and list every failure, so one run shows all problems.
fail-fast = false
failure-output = "immediate-final"

[profile.ci.junit]
# Per-test durations; CI prints the slowest tests from it.
path = "junit.xml"
